name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly: new CVEs are published against packages that have not changed.
  schedule:
    - cron: "17 5 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Same image as docker-compose, so CI exercises the real pgvector
        # operators and index types rather than a stand-in.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: manhwa
          POSTGRES_PASSWORD: manhwa
          POSTGRES_DB: manhwa
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U manhwa -d manhwa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://manhwa:manhwa@localhost:5434/manhwa
      # No API keys. Embeddings are local and every generation call is stubbed in
      # tests, so CI needs no secrets and spends nothing.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run migrations
        run: alembic upgrade head

      - name: Test
        run: pytest -q

  security:
    # Security gates (docs/THREAT_MODEL.md T9). Any finding fails the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans the full history, not just HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install scanners
        run: python -m pip install pip-audit bandit

      - name: Dependency audit (known CVEs in pinned versions)
        # --no-deps --disable-pip: audit exactly the pins in the lock file,
        # without installing them (torch alone is ~1 GB).
        run: pip-audit -r requirements.lock --no-deps --disable-pip

      - name: Static analysis (bandit)
        run: bandit -r app scripts -q

      - name: Secret scan (gitleaks, full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
