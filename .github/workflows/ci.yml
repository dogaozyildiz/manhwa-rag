name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Same image as docker-compose, so CI exercises the real pgvector
        # operators and index types rather than a stand-in.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: manhwa
          POSTGRES_PASSWORD: manhwa
          POSTGRES_DB: manhwa
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U manhwa -d manhwa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://manhwa:manhwa@localhost:5434/manhwa
      # No API keys. Embeddings are local and every generation call is stubbed in
      # tests, so CI needs no secrets and spends nothing.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run migrations
        run: alembic upgrade head

      - name: Test
        run: pytest -q
