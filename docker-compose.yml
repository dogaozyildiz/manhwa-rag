services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: manhwa
      POSTGRES_PASSWORD: manhwa
      POSTGRES_DB: manhwa
    # 5434 to avoid colliding with any other local Postgres.
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manhwa -d manhwa"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
